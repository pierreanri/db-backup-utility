# Local playground and integration test environment:
#   docker compose up -d
#   source dev/integration-env.sh && mvn verify
# Ports are shifted to avoid clashing with services already running on the host.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: pg-secret
    ports: ["15432:5432"]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: mysql-secret
    ports: ["13306:3306"]

  mongo:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: mongo-secret
    ports: ["17017:27017"]

  # S3-compatible object storage (console on http://localhost:9001, minioadmin/minioadmin)
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    ports: ["9000:9000", "9001:9001"]

  # Google Cloud Storage emulator
  gcs:
    image: fsouza/fake-gcs-server:latest
    command: ["-scheme", "http", "-port", "4443", "-backend", "memory", "-external-url", "http://localhost:4443"]
    ports: ["4443:4443"]

  # Azure Blob Storage emulator
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --loose
    ports: ["10000:10000"]
