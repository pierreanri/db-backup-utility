# Local playground and integration test environment:
#   docker compose up -d
#   source dev/integration-env.sh && mvn verify
# Ports are shifted to avoid clashing with services already running on the host.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: pg-secret
    ports: ["15432:5432"]

  # PostgreSQL 17 for physical incremental backups (WAL summarization and replication access)
  pg17:
    image: postgres:17
    command: ["postgres", "-c", "summarize_wal=on"]
    environment:
      POSTGRES_PASSWORD: pg-secret
    volumes:
      - ./dev/pg-replication.sh:/docker-entrypoint-initdb.d/replication.sh:ro
    ports: ["15433:5432"]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: mysql-secret
    ports: ["13306:3306"]

  mongo:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: mongo-secret
    ports: ["17017:27017"]

  # single-node replica set for oplog based incremental backups (initiated by the health check)
  mongo-rs:
    image: mongo:8
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27018:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval",
             "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: '127.0.0.1:27017'}]}).ok }"]
      interval: 5s

  # S3-compatible object storage (console on http://localhost:9001, minioadmin/minioadmin)
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    ports: ["9000:9000", "9001:9001"]

  # Google Cloud Storage emulator
  gcs:
    image: fsouza/fake-gcs-server:latest
    command: ["-scheme", "http", "-port", "4443", "-backend", "memory", "-external-url", "http://localhost:4443"]
    ports: ["4443:4443"]

  # Azure Blob Storage emulator
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --loose
    ports: ["10000:10000"]
